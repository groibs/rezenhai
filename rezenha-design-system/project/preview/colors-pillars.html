<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--rz-creme-50); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .swatch { aspect-ratio: 1.1; border-radius: var(--radius-lg); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-shadow: var(--shadow-soft); position: relative; overflow: hidden; }
  .swatch .name { font-weight: 700; font-size: 13px; letter-spacing: -0.01em; }
  .swatch .hex  { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.7; margin-top: 2px; }
  .dark .name, .dark .hex { color: var(--rz-creme-50); }
  .light .name, .light .hex { color: var(--rz-laje-950); }
  .holo { background: var(--rz-holo); }
  .ring { box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08), var(--shadow-soft); }
</style></head>
<body>
  <div class="row">
    <div class="swatch dark"  style="background:var(--rz-laje-950)"><div class="name">Laje 950</div><div class="hex">#0A0A0A</div></div>
    <div class="swatch light ring" style="background:var(--rz-creme-50)"><div class="name">Creme 50</div><div class="hex">#EFEAE0</div></div>
    <div class="swatch light" style="background:var(--rz-prata-500)"><div class="name">Prata 500</div><div class="hex">#B5B3B2</div></div>
    <div class="swatch dark"  style="background:var(--rz-brasa-500)"><div class="name">Brasa 500</div><div class="hex">#F4571A</div></div>
    <div class="swatch light" style="background:var(--rz-lima-500)"><div class="name">Lima 500</div><div class="hex">#CCEC2A</div></div>
    <div class="swatch light holo"><div class="name">Holo</div><div class="hex">gradient</div></div>
  </div>
</body></html>
