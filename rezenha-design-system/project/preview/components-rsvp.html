<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--rz-creme-50); font-family: var(--font-sans); color: var(--rz-laje-950); }
  .panel { background: var(--rz-papel); border-radius: 20px; padding: 18px; box-shadow: 0 8px 24px -8px rgba(10,10,10,0.12), 0 2px 6px -2px rgba(10,10,10,0.06); }
  .title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .micro { font-size: 12.5px; color: var(--rz-prata-700); margin-top: 2px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
  .btn { padding: 14px 10px; border-radius: 16px; text-align: center; font-weight: 600; cursor: pointer; transition: all 160ms cubic-bezier(0.2,0.7,0.2,1); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .emoji { font-size: 22px; }
  .label { font-size: 13.5px; }
  .yes { background: var(--rz-lima-500); color: var(--rz-laje-950); border: 2px solid var(--rz-laje-950); }
  .maybe { background: var(--rz-papel); color: var(--rz-laje-950); border: 1.5px solid var(--rz-prata-200); }
  .no { background: var(--rz-papel); color: var(--rz-prata-700); border: 1.5px solid var(--rz-prata-200); }
  .footer { font-family: var(--font-mono); font-size: 10px; color: var(--rz-prata-700); margin-top: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
</style></head>
<body>
  <div class="panel">
    <div class="title">Você vai colar?</div>
    <div class="micro">Pack: Churras · selecione uma resposta</div>
    <div class="row">
      <div class="btn yes"><div class="emoji">🥩</div><div class="label">Eu colo</div></div>
      <div class="btn maybe"><div class="emoji">👀</div><div class="label">Talvez</div></div>
      <div class="btn no"><div class="emoji">🧊</div><div class="label">Não colo</div></div>
    </div>
    <div class="footer">positivo · talvez · negativo</div>
  </div>
</body></html>
