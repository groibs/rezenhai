<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--rz-creme-50); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--rz-papel); border-radius: 12px; box-shadow: var(--shadow-soft); }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
  .label { font-size: 13px; font-weight: 600; color: var(--rz-laje-950); }
  .token { font-family: var(--font-mono); font-size: 10px; color: var(--rz-prata-700); margin-left: auto; }
</style></head>
<body>
  <div class="grid">
    <div class="row"><div class="dot" style="background:var(--rz-lima-500)"></div><div class="label">Confirmado · Eu colo</div></div>
    <div class="row"><div class="dot" style="background:var(--rz-prata-300)"></div><div class="label">Talvez</div></div>
    <div class="row"><div class="dot" style="background:var(--rz-laje-700)"></div><div class="label">Não colo</div></div>
    <div class="row"><div class="dot" style="background:var(--rz-lima-500)"></div><div class="label">Pago</div></div>
    <div class="row"><div class="dot" style="background:var(--rz-brasa-300)"></div><div class="label">Pix pendente</div></div>
    <div class="row"><div class="dot" style="background:#D7263D"></div><div class="label">Erro</div></div>
    <div class="row"><div class="dot" style="background:var(--rz-brasa-500)"></div><div class="label">Item disponível</div></div>
    <div class="row"><div class="dot" style="background:var(--rz-prata-300)"></div><div class="label">Item já escolhido</div></div>
    <div class="row"><div class="dot" style="background:var(--rz-prata-500)"></div><div class="label">Rascunho</div></div>
  </div>
</body></html>
