<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px 24px; background: var(--rz-creme-50); font-family: var(--font-sans); color: var(--rz-laje-950); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px dashed var(--rz-prata-200); }
  .row:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--rz-prata-700); width: 130px; flex-shrink: 0; }
  h1.h1 { font-size: 40px; line-height: 1.08; letter-spacing: -0.01em; font-weight: 700; margin: 0; }
  h2.h2 { font-size: 32px; line-height: 1.14; letter-spacing: -0.01em; font-weight: 700; margin: 0; }
  h3.h3 { font-size: 24px; line-height: 1.2; font-weight: 600; margin: 0; }
  h4.h4 { font-size: 20px; line-height: 1.3; font-weight: 600; margin: 0; }
</style></head>
<body>
  <div class="row"><div class="meta">H1 · 40 / 1.08</div><h1 class="h1">Churras dos amigos</h1></div>
  <div class="row"><div class="meta">H2 · 32 / 1.14</div><h2 class="h2">Você vai colar?</h2></div>
  <div class="row"><div class="meta">H3 · 24 / 1.20</div><h3 class="h3">Confirmação de presença</h3></div>
  <div class="row"><div class="meta">H4 · 20 / 1.30</div><h4 class="h4">Quem leva o quê</h4></div>
</body></html>
