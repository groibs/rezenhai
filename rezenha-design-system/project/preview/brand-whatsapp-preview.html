<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: #ECE5DD; font-family: var(--font-sans); }
  .frame { max-width: 360px; margin: 0 auto; }
  .msg { background: white; border-radius: 8px 8px 8px 0; padding: 4px; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
  .cover { aspect-ratio: 1.91/1; border-radius: 6px 6px 0 0; background: var(--rz-holo); display: flex; flex-direction: column; justify-content: flex-end; padding: 14px; position: relative; overflow: hidden; }
  .h { font-family: var(--font-display); font-size: 22px; line-height: 0.95; color: var(--rz-laje-950); letter-spacing: -0.02em; }
  .sub { font-size: 11px; color: var(--rz-laje-950); font-weight: 600; margin-top: 4px; }
  .body { padding: 6px 8px 8px; }
  .title { font-weight: 600; font-size: 13px; color: var(--rz-laje-950); }
  .desc { font-size: 12px; color: #5a6671; margin-top: 2px; line-height: 1.3; }
  .url { font-size: 11px; color: #8696a0; margin-top: 4px; }
  .meta { font-size: 10px; color: #8696a0; margin-top: 4px; padding: 0 4px; display: flex; justify-content: flex-end; gap: 4px; }
</style></head>
<body>
  <div class="frame">
    <div class="msg">
      <div class="cover">
        <div class="h">churras<br>dos amigos</div>
        <div class="sub">Sáb, 27/07 · 19h · laje da Bia</div>
      </div>
      <div class="body">
        <div class="title">Churras dos amigos · Rezenhaí</div>
        <div class="desc">Confirma presença, vê quem vai e pega o Pix do rolê.</div>
        <div class="url">rezenhai.app/churras-amigos</div>
      </div>
    </div>
    <div class="meta">14:32 ✓✓</div>
  </div>
</body></html>
