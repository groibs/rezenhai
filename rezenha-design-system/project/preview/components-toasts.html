<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--rz-creme-50); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 10px; }
  .toast { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; font-size: 14.5px; font-weight: 500; max-width: 540px; box-shadow: 0 8px 24px -8px rgba(10,10,10,0.18); }
  .ok { background: var(--rz-laje-950); color: var(--rz-creme-50); }
  .ok .ic { background: var(--rz-lima-500); }
  .err { background: var(--rz-laje-950); color: var(--rz-creme-50); }
  .err .ic { background: #D7263D; color: var(--rz-creme-50); }
  .info { background: var(--rz-papel); color: var(--rz-laje-950); border: 1px solid var(--rz-prata-200); }
  .info .ic { background: var(--rz-laje-950); color: var(--rz-creme-50); }
  .ic { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: var(--rz-laje-950); flex-shrink: 0; }
  .close { margin-left: auto; opacity: 0.6; font-family: var(--font-mono); font-size: 14px; cursor: pointer; }
</style></head>
<body>
  <div class="toast ok"><div class="ic">✓</div>Presença confirmada. <span class="close">✕</span></div>
  <div class="toast ok"><div class="ic">✓</div>Link copiado. <span class="close">✕</span></div>
  <div class="toast info"><div class="ic">i</div>Seu convite está pronto pra circular. <span class="close">✕</span></div>
  <div class="toast err"><div class="ic">!</div>Não rolou enviar a foto. Tenta de novo? <span class="close">✕</span></div>
</body></html>
