<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--rz-creme-50); font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .box { background: var(--rz-papel); border: 1px solid var(--rz-prata-200); width: 92px; height: 78px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; }
  .name { font-size: 11px; font-weight: 700; color: var(--rz-laje-950); }
  .meta { font-family: var(--font-mono); font-size: 9.5px; color: var(--rz-prata-700); }
</style></head>
<body>
  <div class="row">
    <div class="box" style="border-radius:4px"><div class="name">xs</div><div class="meta">4px</div></div>
    <div class="box" style="border-radius:8px"><div class="name">sm</div><div class="meta">8</div></div>
    <div class="box" style="border-radius:12px"><div class="name">md</div><div class="meta">12</div></div>
    <div class="box" style="border-radius:16px"><div class="name">lg</div><div class="meta">16</div></div>
    <div class="box" style="border-radius:20px"><div class="name">xl · card</div><div class="meta">20</div></div>
    <div class="box" style="border-radius:28px"><div class="name">2xl · template</div><div class="meta">28</div></div>
    <div class="box" style="border-radius:36px"><div class="name">3xl · cover</div><div class="meta">36</div></div>
    <div class="box" style="border-radius:999px"><div class="name">full · pill</div><div class="meta">999</div></div>
  </div>
</body></html>
