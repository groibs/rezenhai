<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--rz-creme-50); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: 6px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--rz-brasa-500); border-radius: 4px; width: 28px; }
  .meta { font-family: var(--font-mono); font-size: 9.5px; color: var(--rz-prata-700); }
  .name { font-size: 11px; font-weight: 600; color: var(--rz-laje-950); }
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><div class="name">1</div><div class="meta">4px</div></div>
    <div class="col"><div class="bar" style="height:8px"></div><div class="name">2</div><div class="meta">8</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="name">3</div><div class="meta">12</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="name">4</div><div class="meta">16</div></div>
    <div class="col"><div class="bar" style="height:20px"></div><div class="name">5</div><div class="meta">20</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="name">6</div><div class="meta">24</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="name">8</div><div class="meta">32</div></div>
    <div class="col"><div class="bar" style="height:40px"></div><div class="name">10</div><div class="meta">40</div></div>
    <div class="col"><div class="bar" style="height:48px"></div><div class="name">12</div><div class="meta">48</div></div>
    <div class="col"><div class="bar" style="height:64px"></div><div class="name">16</div><div class="meta">64</div></div>
    <div class="col"><div class="bar" style="height:80px"></div><div class="name">20</div><div class="meta">80</div></div>
    <div class="col"><div class="bar" style="height:96px"></div><div class="name">24</div><div class="meta">96</div></div>
  </div>
</body></html>
