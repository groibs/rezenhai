<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--rz-creme-50); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tpl { aspect-ratio: 4/5; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 14px; position: relative; overflow: hidden; box-shadow: 0 12px 32px -12px rgba(10,10,10,0.3); }
  .name { position: absolute; bottom: 8px; left: 12px; font-family: var(--font-mono); font-size: 9.5px; color: var(--rz-creme-50); text-transform: uppercase; letter-spacing: 0.05em; mix-blend-mode: difference; }
  .t1 { background: var(--rz-holo); color: var(--rz-laje-950); }
  .t1 .h { font-family: var(--font-display); font-size: 22px; line-height: 0.9; text-align: center; letter-spacing: -0.02em; }
  .t2 { background: var(--rz-laje-950); color: var(--rz-lima-500); }
  .t2 .h { font-family: var(--font-display); font-size: 22px; line-height: 0.9; text-align: center; letter-spacing: -0.02em; }
  .t3 { background: var(--rz-brasa-500); color: var(--rz-laje-950); }
  .t3 .h { font-family: var(--font-display); font-size: 22px; line-height: 0.9; text-align: center; letter-spacing: -0.02em; }
  .t4 { background: var(--rz-creme-50); color: var(--rz-laje-950); border: 1px solid var(--rz-prata-200); }
  .t4 .h { font-family: var(--font-sans); font-weight: 800; font-size: 18px; line-height: 1; text-align: center; letter-spacing: -0.02em; text-transform: uppercase; }
</style></head>
<body>
  <div class="grid">
    <div class="tpl t1"><div class="h">noite do<br>karaokê</div><div class="name">tpl-holo</div></div>
    <div class="tpl t2"><div class="h">game<br>night</div><div class="name">tpl-noite</div></div>
    <div class="tpl t3"><div class="h">churras<br>dos amigos</div><div class="name">tpl-brasa</div></div>
    <div class="tpl t4"><div class="h">resenha<br>na laje</div><div class="name">tpl-papel</div></div>
  </div>
</body></html>
