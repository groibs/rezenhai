<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--rz-creme-50); font-family: var(--font-sans); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .btn { font-family: var(--font-sans); font-weight: 600; font-size: 15px; border: none; cursor: pointer; padding: 12px 20px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; letter-spacing: -0.005em; transition: all 160ms cubic-bezier(0.2,0.7,0.2,1); }
  .primary  { background: var(--rz-brasa-500); color: var(--rz-creme-50); }
  .secondary{ background: var(--rz-laje-950); color: var(--rz-creme-50); }
  .ghost    { background: transparent; color: var(--rz-laje-950); box-shadow: inset 0 0 0 1.5px var(--rz-laje-950); }
  .lima     { background: var(--rz-lima-500); color: var(--rz-laje-950); }
  .destroy  { background: transparent; color: #D7263D; box-shadow: inset 0 0 0 1.5px #D7263D; }
  .disabled { background: var(--rz-prata-300); color: var(--rz-prata-700); cursor: not-allowed; }
  .loading  { background: var(--rz-brasa-500); color: var(--rz-creme-50); opacity: 0.8; }
  .dot { width:8px; height:8px; border-radius:50%; background: currentColor; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
</style></head>
<body>
  <div class="row">
    <button class="btn primary">Criar meu convite</button>
    <button class="btn secondary">Publicar convite</button>
    <button class="btn ghost">Trocar vibe</button>
    <button class="btn lima">Eu colo</button>
    <button class="btn destroy">Excluir</button>
    <button class="btn disabled">Continuar</button>
    <button class="btn loading"><span class="dot"></span>Salvando…</button>
  </div>
</body></html>
